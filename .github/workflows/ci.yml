name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The upstream `docker` job (GHCR publish) is removed on this fork. Its tag is
  # ghcr.io/${{ github.repository }}, which is `jross300-vfe/OpenBrain` here --
  # uppercase, so an invalid Docker reference and a red run on every master push,
  # which the OB1 build gate reads as a refusal. The image is built on vfe-mule by
  # phase1-5-build.sh, never pulled from GHCR, so nothing consumes this job.
